<title>홈트 타이머 A/B/C</title>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5; --surface:#ffffff; --text:#12161c; --muted:#5f6876; --line:#d9dfe7;
  --accent:#2d4cf0; --on-accent:#ffffff;
  --work:#0c8f7c; --rest:#3a56d4; --easy:#b86f0e;
  --work-bg:#dcf2ee; --rest-bg:#e1e7fb; --easy-bg:#f6ead3;
  --page:var(--bg);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1015; --surface:#171b22; --text:#f1f3f6; --muted:#98a1ae; --line:#272d37;
    --accent:#7d93ff; --on-accent:#0a0d14;
    --work:#3fd6bf; --rest:#8ea3ff; --easy:#f2b45a;
    --work-bg:#0a2420; --rest-bg:#0f1738; --easy-bg:#261b09;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1015; --surface:#171b22; --text:#f1f3f6; --muted:#98a1ae; --line:#272d37;
  --accent:#7d93ff; --on-accent:#0a0d14;
  --work:#3fd6bf; --rest:#8ea3ff; --easy:#f2b45a;
  --work-bg:#0a2420; --rest-bg:#0f1738; --easy-bg:#261b09;
}
html[data-kind="work"]{--page:var(--work-bg)}
html[data-kind="rest"]{--page:var(--rest-bg)}
html[data-kind="easy"]{--page:var(--easy-bg)}
html{height:100%;background:var(--page);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--page);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
#app{height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* ---------- Home / detail ---------- */
.page{min-height:100%;padding:20px 18px 40px;max-width:560px;margin:0 auto;box-sizing:border-box}
.page h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.page .lead{color:var(--muted);margin-top:6px;font-size:15px}
.next-card{margin-top:22px;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:20px}
.next-card small{opacity:.8;font-size:13px}
.next-card .big{font-size:34px;font-weight:800;margin:4px 0 14px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:0 20px;border-radius:16px;
  font-weight:700;font-size:17px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--k,var(--accent));color:var(--on-accent);border-color:transparent}
.btn.light{background:var(--on-accent);color:var(--accent);border-color:transparent}
.btn.block{width:100%}
.days{display:grid;gap:10px;margin-top:18px}
.day{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.day .badge{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;font-weight:800;background:var(--bg);color:var(--accent)}
.day b{display:block;font-size:17px}
.day span{color:var(--muted);font-size:14px}
.day.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sec{margin-top:26px}
.sec h3{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.toggles{display:grid;gap:8px}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;font-size:16px;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed="true"] .sw{background:var(--accent)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.note{color:var(--muted);font-size:13px;line-height:1.55;margin-top:12px}
.hist{color:var(--muted);font-size:14px;margin-top:14px}
.topnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.phase-h{margin:22px 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px}
.row span{color:var(--muted);font-size:13px}
.row .go{flex:none;width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent);font-size:16px}

/* ---------- Player ---------- */
.player{height:100%;display:flex;flex-direction:column;padding:10px 18px 14px;box-sizing:border-box;overflow:hidden;
  --k:var(--accent)}
.player[data-kind="work"]{--k:var(--work)}
.player[data-kind="rest"]{--k:var(--rest)}
.player[data-kind="easy"]{--k:var(--easy)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;font-weight:700}
.chip{font-weight:800;font-size:16px;color:var(--k)}
.cnt{color:var(--muted);font-size:15px;min-width:44px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--k);transition:width .3s}
.center{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:6px 0}
.setline{font-size:17px;font-weight:700;color:var(--k)}
.name{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.02em;max-width:100%}
.time{font-size:clamp(96px,34vw,168px);font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--text);margin:4px 0}
.target{font-size:clamp(58px,20vw,96px);font-weight:800;line-height:1.05;color:var(--text);margin:4px 0}
.tbar{width:78%;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--k)}
.cue{font-size:16px;line-height:1.5;color:var(--muted);max-width:420px;margin-top:6px}
.nextline{font-size:15px;color:var(--muted);text-align:center;padding:8px 0 10px}
.nextline b{color:var(--text)}
.controls{display:flex;gap:10px}
.controls .btn{flex:1;min-height:64px;font-size:18px}
.controls .btn.main{flex:2;font-size:22px}
.player .paused{font-size:15px;font-weight:800;color:var(--k)}

/* confirm sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:end center;z-index:80;padding:16px;box-sizing:border-box}
.sheet .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:480px;display:grid;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{font-size:19px}
.sheet p{color:var(--muted);font-size:15px}

/* done */
.done{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:24px;box-sizing:border-box}
.done h1{font-size:34px;font-weight:800}
.done p{color:var(--muted);font-size:17px}

/* flash overlay */
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:99}
#flash.f-tick{background:var(--accent);animation:fl .35s ease-out}
#flash.f-go{background:var(--work);animation:fl2 .7s ease-out}
#flash.f-end{background:var(--accent);animation:fl2 .6s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
@keyframes fl2{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#flash{animation-duration:.01s!important}}
/* log */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 0;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.addbox{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.addbox h3{font-size:15px;margin-bottom:10px}
.inp{width:100%;box-sizing:border-box;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;font-size:16px}
.abtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.abtns .btn{min-height:50px;padding:0}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.monthbar b{font-size:17px}
.mnav{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cd{aspect-ratio:1/1.05;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:13px;color:var(--text)}
.cd.emp{background:none;border:0}
.cd.today{border-color:var(--accent);border-width:2px}
.cd.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.has{background:var(--accent);color:var(--on-accent);border-color:transparent}
.cd b{font-size:13px;font-weight:800}
.lg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lg .d{flex:1;min-width:0}
.lg .d b{display:block;font-size:16px}
.lg .d span{color:var(--muted);font-size:13px}
.lg .del{flex:none;min-height:40px;padding:0 12px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:14px;font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= Data ================= */
const WARM=[
 {name:'제자리 걷기 + 팔 돌리기',dur:40,cue:'가볍게 걸으며 팔을 앞뒤로 크게 돌려 체온을 올려요.'},
 {name:'손목·발목 돌리기',dur:30,cue:'손목과 발목을 양방향으로 천천히 돌려요. 푸시업 전 손목 준비예요.'},
 {name:'캣카우',dur:40,cue:'네발 자세에서 숨을 내쉬며 등을 둥글게, 들이쉬며 펴요.'},
 {name:'월드 그레이티스트 스트레치',dur:60,cue:'런지 자세에서 팔꿈치를 앞발 안쪽으로 내리고 몸통을 열어요. 좌우 30초씩.'},
 {name:'밴드 풀어파트',dur:40,cue:'밴드를 어깨너비로 잡고 팔을 편 채 가슴을 열며 양옆으로 당겨요.'},
 {name:'스쿼트 투 스탠드',dur:30,cue:'발끝을 잡고 깊게 앉았다가, 엉덩이를 들며 가슴을 펴고 일어나요.'}
];
const COOL=[
 {name:'가슴 스트레칭',dur:40,cue:'벽이나 문틀에 팔을 대고 가슴을 앞으로 밀어요. 좌우 20초씩.'},
 {name:'어깨 뒤 스트레칭',dur:40,cue:'한 팔을 가슴 앞으로 가로질러 반대 팔로 당겨요. 좌우 20초씩.'},
 {name:'삼두·팔꿈치 스트레칭',dur:40,cue:'팔꿈치를 머리 뒤로 접고 반대 손으로 지그시 눌러요. 아프면 약하게.'},
 {name:'대퇴사두 스트레칭',dur:40,cue:'서서 발목을 잡아 뒤꿈치를 엉덩이로. 무릎은 모으고 좌우 20초씩.'},
 {name:'햄스트링 스트레칭',dur:40,cue:'한 다리를 앞으로 뻗고 등을 펴서 상체를 숙여요. 좌우 20초씩.'},
 {name:'고관절 굴곡근 스트레칭',dur:40,cue:'무릎 꿇고 한 발을 앞으로, 골반을 앞으로 밀어요. 좌우 20초씩.'},
 {name:'아이 자세',dur:60,cue:'엉덩이를 뒤꿈치로 보내고 팔을 길게 뻗어 깊게 호흡해요.'}
];
const DAYS={
 A:{title:'Day A',sub:'하체·힙 + 코어',blocks:[
  {t:'reps',name:'맨몸 스쿼트',sets:3,target:'12–15회',rest:45,cue:'발은 어깨너비. 엉덩이를 뒤로 앉듯 내려가고 무릎은 발끝 방향, 가슴은 펴요.'},
  {t:'reps',name:'글루트 브릿지',sets:3,target:'12–15회',rest:45,cue:'뒤꿈치로 밀어 올리며 엉덩이를 조여요. 허리를 과하게 꺾지 마요.'},
  {t:'reps',name:'스플릿 스쿼트',sets:3,target:'좌우 각 10회',rest:45,cue:'앞발에 체중, 몸통은 수직. 뒷무릎이 바닥에 닿기 직전까지 내려가요.'},
  {t:'reps',name:'밴드 레그프레스 / 카프레이즈',sets:3,target:'15회',rest:30,cue:'밴드를 발에 걸어 밀거나, 뒤꿈치를 끝까지 들어 1초 멈춰요.'},
  {t:'reps',name:'데드버그',sets:3,target:'좌우 각 8회',rest:30,cue:'허리를 매트에 붙이고 반대 팔과 다리를 천천히 뻗어요.'},
  {t:'hold',name:'플랭크',sets:3,dur:30,rest:30,cue:'머리부터 뒤꿈치까지 일직선. 엉덩이를 조이고 허리가 처지지 않게.'}
 ]},
 B:{title:'Day B',sub:'상체 + 코어',blocks:[
  {t:'reps',name:'인클라인 푸시업',sets:3,target:'10–12회',rest:45,cue:'팔꿈치는 몸통에서 45도 이내. 팔꿈치가 아프면 손 위치를 더 높게.'},
  {t:'reps',name:'밴드 로우',sets:3,target:'12–15회',rest:45,cue:'날개뼈를 모으며 팔꿈치를 뒤로 당겨요. 어깨는 으쓱하지 않기.'},
  {t:'reps',name:'철봉 네거티브 풀업 / 행잉',sets:3,target:'5회 또는 20~30초',rest:60,cue:'점프로 올라가 3~5초에 걸쳐 천천히 내려오거나, 어깨를 내린 채 매달려요.'},
  {t:'reps',name:'파이크 푸시업',sets:3,target:'8–10회',rest:45,cue:'엉덩이를 높이 든 채 머리를 손 사이로. 팔꿈치 45도, 통증이 오면 중단.'},
  {t:'reps',name:'밴드 오버헤드 프레스',sets:3,target:'12회',rest:30,cue:'갈비뼈를 닫고 허리 꺾임 없이 머리 위로 수직으로 밀어요.'},
  {t:'hold',name:'사이드 플랭크',sets:4,dur:20,rest:30,alt:['왼쪽','오른쪽'],cue:'팔꿈치는 어깨 아래. 골반이 내려가지 않게 몸을 일직선으로.'}
 ]},

/* ================= Build steps ================= */
function title(s){let t=s.name;if(s.sets)t+=' · '+s.set+'/'+s.sets+'세트';if(s.circuit)t+=' · '+s.round+'라운드';return t;}
function build(day){
  const steps=[],groups=[];let gid=0;
  const addGroup=(name,phase,meta)=>{groups.push({id:gid,name,phase,meta,first:steps.length});return gid++;};
  let lastG=0;
  WARM.forEach(w=>{const g=addGroup(w.name,'warm',w.dur+'초');lastG=g;steps.push({kind:'timed',phase:'warm',gid:g,name:w.name,cue:w.cue,dur:w.dur});});
  steps.push({kind:'rest',phase:'main',gid:lastG,name:'본운동 준비',dur:10});
  const D=DAYS[day];
  if(day==='C'){
    for(let r=1;r<=D.rounds;r++){
      const g=addGroup(r+'라운드','main',D.moves.length+'동작 × '+D.workSec+'초 연속');lastG=g;
      D.moves.forEach((m,mi)=>steps.push({kind:'timed',phase:'main',gid:g,name:m.name,cue:m.cue,dur:D.workSec,circuit:true,round:r,rounds:D.rounds,mi:mi+1,mn:D.moves.length}));
      if(r<D.rounds)steps.push({kind:'rest',phase:'main',gid:g,name:'라운드 휴식',dur:D.roundRest});
    }
  }else{
    D.blocks.forEach((b,bi)=>{
      const meta=b.t==='reps'?(b.sets+'세트 · '+b.target+' · 휴식 '+b.rest+'초'):(b.sets+'세트 × '+b.dur+'초 · 휴식 '+b.rest+'초');
      const g=addGroup(b.name,'main',meta);lastG=g;
      for(let s=1;s<=b.sets;s++){
        const lab=b.alt?b.alt[(s-1)%b.alt.length]:null;
        const nm=lab?b.name+' ('+lab+')':b.name;
        if(b.t==='reps')steps.push({kind:'reps',phase:'main',gid:g,name:nm,cue:b.cue,target:b.target,set:s,sets:b.sets});
        else steps.push({kind:'timed',phase:'main',gid:g,name:nm,cue:b.cue,dur:b.dur,set:s,sets:b.sets});
        if(!(bi===D.blocks.length-1&&s===b.sets))steps.push({kind:'rest',phase:'main',gid:g,name:'휴식',dur:b.rest});
      }
    });
  }
  steps.push({kind:'rest',phase:'cool',gid:lastG,name:'쿨다운 준비',dur:5});
  COOL.forEach(w=>{const g=addGroup(w.name,'cool',w.dur+'초');steps.push({kind:'timed',phase:'cool',gid:g,name:w.name,cue:w.cue,dur:w.dur});});
  steps.forEach((s,i)=>{if(s.kind==='rest'){const n=steps[i+1];s.next=n?title(n):'';s.nextName=n?n.name:'';s.nextCue=n?(n.cue||''):'';}});
  return {steps,groups};
}

let ctx=null,silentEl=null,koVoice=null;
function silentWav(){
  const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);
  dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return 'data:audio/wav;base64,'+btoa(s);
}
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC();}
    if(ctx){
      if(ctx.state==='suspended')ctx.resume();
      const b=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();
      src.buffer=b;src.connect(ctx.destination);src.start(0);
    }
  }catch(e){}
  try{
    if(!silentEl){
      silentEl=document.createElement('audio');
      silentEl.src=silentWav();silentEl.loop=true;
      silentEl.setAttribute('playsinline','');silentEl.setAttribute('aria-hidden','true');
    }
    const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
  initAudioEl();
  pickVoice();
}
function beep(f,d,v,type,delay){
  if(!S.opt.sound||!ctx)return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain(),t0=ctx.currentTime+(delay||0);
    o.type=type||'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v||0.6,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+d+0.03);
  }catch(e){}
}
const WA={
  tick(){beep(720,.12,.7,'triangle');},
  go(){beep(1100,.55,.8,'triangle');},
  end(){beep(560,.18,.7,'triangle');beep(560,.18,.7,'triangle',.22);},
  set(){beep(880,.1,.6,'sine');beep(1320,.2,.6,'sine',.12);},
  finish(){[523,659,784,1047].forEach((f,i)=>beep(f,.25,.6,'sine',i*.16));}
};
/* iPhone: <audio> 요소는 무음 스위치를 무시하므로 효과음을 WAV로 만들어 재생 */
function toneWav(parts){
  const sr=22050;let total=0;parts.forEach(p=>{total=Math.max(total,p.at+p.d);});total+=0.05;
  const n=Math.floor(sr*total),b=new Uint8Array(44+n*2),dv=new DataView(b.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
  const buf=new Float32Array(n);
  parts.forEach(p=>{const s0=Math.floor(p.at*sr),len=Math.floor(p.d*sr);
    for(let i=0;i<len&&s0+i<n;i++){const t=i/sr,att=Math.min(1,t/0.008),dec=Math.exp(-3*t/p.d);
      buf[s0+i]+=(Math.sin(2*Math.PI*p.f*t)+0.3*Math.sin(4*Math.PI*p.f*t))*0.75*p.v*att*dec;}});
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,buf[i]));dv.setInt16(44+i*2,x*32767,true);}
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return 'data:audio/wav;base64,'+btoa(s);
}
let aEl=null,htmlOk=false,lastErr='',triedBlob=false;const WAVS={};
function toBlob(uri){
  try{const s=atob(uri.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
    return URL.createObjectURL(new Blob([u],{type:'audio/wav'}));}catch(e){return uri;}
}
function initAudioEl(){
  try{
    if(!aEl){
      aEl=document.createElement('audio');aEl.setAttribute('playsinline','');aEl.preload='auto';
      WAVS.silent=toneWav([{f:440,d:.05,v:0,at:0}]);
      WAVS.tick=toneWav([{f:720,d:.12,v:.9,at:0}]);
      WAVS.go=toneWav([{f:1100,d:.55,v:.9,at:0}]);
      WAVS.end=toneWav([{f:560,d:.18,v:.9,at:0},{f:560,d:.18,v:.9,at:.22}]);
      WAVS.set=toneWav([{f:880,d:.1,v:.8,at:0},{f:1320,d:.2,v:.8,at:.12}]);
      WAVS.finish=toneWav([523,659,784,1047].map((f,i)=>({f:f,d:.3,v:.8,at:i*.16})));
    }
    aEl.onerror=function(){lastErr='오디오 로드 실패';};
    aEl.src=WAVS.silent;
    const p=aEl.play();
    if(p&&p.then)p.then(()=>{htmlOk=true;lastErr='';}).catch(err=>{
      htmlOk=false;lastErr=(err&&err.name)||'error';
      if(!triedBlob&&lastErr!=='NotAllowedError'){
        triedBlob=true;
        Object.keys(WAVS).forEach(k=>{WAVS[k]=toBlob(WAVS[k]);});
        try{aEl.src=WAVS.silent;const q=aEl.play();
          if(q&&q.then)q.then(()=>{htmlOk=true;lastErr='';}).catch(e2=>{lastErr+=' / blob:'+((e2&&e2.name)||'error');});}catch(e3){}
      }
    });
  }catch(e){htmlOk=false;lastErr='예외';}
}
function sndPlay(n){
  if(!S.opt.sound)return;
  if(htmlOk&&aEl){
    try{aEl.src=WAVS[n];aEl.currentTime=0;const p=aEl.play();if(p&&p.catch)p.catch(()=>{htmlOk=false;WA[n]();});return;}
    catch(e){htmlOk=false;}
  }
  WA[n]();
}
const SND={
  tick(){sndPlay('tick');},go(){sndPlay('go');},end(){sndPlay('end');},
  set(){sndPlay('set');},finish(){sndPlay('finish');}
};
function pickVoice(){
  try{
    if(!('speechSynthesis' in window))return;
    const vs=speechSynthesis.getVoices();
    koVoice=vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().indexOf('ko')===0)||null;
  }catch(e){}
}
try{if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}}catch(e){}
function say(t){
  if(!S.opt.voice||!('speechSynthesis' in window))return;
  try{
    const u=new SpeechSynthesisUtterance(String(t).replace(/[()]/g,' '));
    u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=1.05;u.volume=1;
    const go=()=>{try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}};
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80);}
    else go();
  }catch(e){}
}

  const rows=list.length?list.map(o=>{
    const dt=new Date(o.h.ts);
    return '<div class="lg"><div class="d"><b>'+(dt.getMonth()+1)+'/'+dt.getDate()+' ('+DOW[dt.getDay()]+') · '+DAYS[o.h.day].title+'</b><span>'+DAYS[o.h.day].sub+' · '+(o.h.mins?o.h.mins+'분':'직접 기록')+'</span></div><button class="del" data-act="dellog" data-i="'+o.i+'">'+(S.delArm===o.i?'정말 삭제?':'삭제')+'</button></div>';
  }).join(''):'<p class="note">아직 기록이 없어요. 운동을 끝까지 마치면 자동으로 쌓여요. 위에서 직접 추가할 수도 있어요.</p>';
  app.innerHTML='<div class="page"><div class="topnav"><button class="back" data-act="home">‹ 뒤로</button></div>'+
   '<h1>운동 기록</h1>'+
   '<div class="stats"><div class="stat"><b class="num">'+S.hist.length+'</b><span>전체</span></div><div class="stat"><b class="num">'+cnt.A+'</b><span>Day A</span></div><div class="stat"><b class="num">'+cnt.B+'</b><span>Day B</span></div><div class="stat"><b class="num">'+cnt.C+'</b><span>Day C</span></div></div>'+
   '<div class="addbox"><h3>기록 직접 추가</h3><input class="inp" type="date" id="logdate" value="'+S.logDate+'"><div class="abtns"><button class="btn" data-act="addlog" data-day="A">A 했어요</button><button class="btn" data-act="addlog" data-day="B">B 했어요</button><button class="btn" data-act="addlog" data-day="C">C 했어요</button></div></div>'+
   '<div class="monthbar"><button class="mnav" data-act="mprev">‹</button><b>'+y+'년 '+(mo+1)+'월</b><button class="mnav" data-act="mnext">›</button></div>'+
   '<div class="cal">'+cal+'</div>'+
   '<div class="phase-h">기록 목록 (최신순)</div>'+rows+
   '<button class="btn block" style="margin-top:10px" data-act="copylog">기록 복사하기</button><div id="logmsg" class="note"></div>'+
   '<p class="note">기록은 이 기기의 이 브라우저에만 저장돼요. 사파리 탭과 홈 화면 앱은 기록이 따로 저장되니 한쪽으로만 쓰세요. 가끔 "기록 복사하기"로 메모 앱에 백업해 두면 안전해요.</p></div>';
}
function renderDone(){
  document.documentElement.dataset.kind='';
  const d=S.doneInfo;
  app.innerHTML='<div class="done"><div style="font-size:64px">🎉</div><h1>'+DAYS[d.day].title+' 완료</h1><p>소요 시간 약 '+d.mins+'분<br>수고하셨어요!</p>'+
   '<button class="btn primary" style="margin-top:14px;min-width:220px" data-act="home">홈으로</button></div>';
}
function render(){
  if(S.screen==='home')renderHome();
  else if(S.screen==='detail')renderDetail();
  else if(S.screen==='player')renderPlayer();
  else if(S.screen==='log')renderLog();
  else renderDone();
}

/* ================= Engine ================= */
function announce(s){
  if(s.kind==='rest'){say(s.name+'. '+(s.nextName?'다음은 '+s.nextName:''));}
  else if(s.kind==='reps'){say(s.name+'. '+s.set+'세트');}
  else if(s.circuit){say(s.name);}
  else if(s.sets){say(s.name+'. '+s.set+'세트');}
  else say(s.name);
}
function startStep(i,silent){
  if(i>=S.steps.length)return finish();
  S.i=Math.max(0,i);S.paused=false;S.confirm=false;
  const s=S.steps[S.i];
  if(s.kind!=='reps'){S.durMs=s.dur*1000;S.remain=S.durMs;S.endAt=Date.now()+S.durMs;}
  render();
  if(!silent)announce(s);
}
function endTimed(){
  const s=S.steps[S.i];
  if(s.kind==='rest'){SND.go();flash('go',[200]);}
  else{SND.end();flash('end',[120,80,120]);}
  startStep(S.i+1);
}
function tick(){
  if(S.screen!=='player'||S.paused||S.confirm)return;
  const s=S.steps[S.i];if(!s||s.kind==='reps')return;
  const rem=S.endAt-Date.now(),sec=Math.max(0,Math.ceil(rem/1000));
  if(sec!==S.shown){
    S.shown=sec;
    const t=document.getElementById('time');if(t)t.textContent=fmt(sec);
    if(sec>=1&&sec<=3){SND.tick();flash('tick',[40]);}
    if(sec===10&&s.dur>=30&&!s.circuit&&s.kind!=='rest')say('10초');
  }
  const f=document.getElementById('tfill');
  if(f)f.style.width=Math.min(100,Math.max(0,(1-rem/S.durMs)*100))+'%';
  if(rem<=0)endTimed();
}
setInterval(tick,100);

function startWorkout(day,g){
  unlock();
  const b=build(day);S.day=day;S.steps=b.steps;S.groups=b.groups;
  S.screen='player';S.startedAt=Date.now();S.confirm=false;
  lockOn();
  startStep(b.groups[g].first);
}
function finish(){
  const mins=Math.max(1,Math.round((Date.now()-S.startedAt)/60000));
  S.hist.push({day:S.day,ts:Date.now(),mins:mins});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  store.set('hist',S.hist);
  S.doneInfo={day:S.day,mins:mins};S.screen='done';
  lockOff();SND.finish();flash('go',[300,100,300]);
  say('수고하셨습니다. '+DAYS[S.day].title+' 완료');
  render();
}
function exitWorkout(){
  try{speechSynthesis.cancel();}catch(e){}
  lockOff();S.confirm=false;S.screen='home';render();
}

/* ================= Events ================= */
app.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='log'){S.screen='log';S.logMonth=null;S.logDate=ymd(Date.now());S.delArm=-1;render();}
  else if(a==='mprev'||a==='mnext'){const m=S.logMonth;S.logMonth=new Date(m.getFullYear(),m.getMonth()+(a==='mnext'?1:-1),1);render();}
  else if(a==='pickdate'){S.logDate=b.dataset.d;render();}
  else if(a==='addlog'){
    const inp=document.getElementById('logdate'),v=inp&&inp.value;
    if(!v)return;
    const p=v.split('-').map(Number);
    S.hist.push({day:b.dataset.day,ts:new Date(p[0],p[1]-1,p[2],12,0,0).getTime(),mins:0,manual:true});
    S.hist.sort((x,y)=>x.ts-y.ts);store.set('hist',S.hist);
    S.logDate=v;S.logMonth=new Date(p[0],p[1]-1,1);S.delArm=-1;render();
  }
  else if(a==='dellog'){
    const i=parseInt(b.dataset.i,10);
    if(S.delArm===i){S.hist.splice(i,1);store.set('hist',S.hist);S.delArm=-1;}else S.delArm=i;
    render();
  }
  else if(a==='copylog'){
    const t=S.hist.map(h=>ymd(h.ts)+' '+DAYS[h.day].title+(h.mins?' '+h.mins+'분':'')).join('\n');
    const m=document.getElementById('logmsg');
    const ok=()=>{if(m)m.textContent='복사했어요. 메모 앱에 붙여넣어 보관하세요.';},fail=()=>{if(m)m.textContent='복사에 실패했어요.';};
    try{navigator.clipboard.writeText(t).then(ok,fail);}catch(e){fail();}
  }
  else if(a==='open'){S.day=b.dataset.day;S.groups=build(S.day).groups;S.screen='detail';render();}
  else if(a==='home'){S.screen='home';render();}
  else if(a==='start'){startWorkout(S.day,parseInt(b.dataset.g,10)||0);}
  else if(a==='toggle'){const k=b.dataset.k;S.opt[k]=!S.opt[k];store.set('opt',S.opt);if(k==='sound'||k==='voice')unlock();render();}
  else if(a==='test'){
    unlock();flash('go',[200]);say('소리 테스트입니다. 잘 들리나요?');
    setTimeout(()=>{
      SND.tick();setTimeout(SND.go,500);
      const d=document.getElementById('diag');
      if(d){
        const vs=('speechSynthesis' in window)?(koVoice?'한국어 음성 있음':'한국어 음성 없음(기본 음성 사용)'):'음성 미지원';
        d.textContent='효과음 방식: '+(lastErr?'['+lastErr+'] ':'')+(htmlOk?'오디오 재생(무음 스위치 무시)':(ctx?'WebAudio ('+ctx.state+')':'사용 불가'))+' · 음성: '+vs+'. 아무 소리도 안 들리면 볼륨, 무음 스위치, 사파리 주소창 aA 메뉴의 "탭 음소거"를 확인해 주세요.';
      }
    },2600);
  }
  else if(a==='done'){SND.set();flash('go',[60]);startStep(S.i+1);}
  else if(a==='skip'){startStep(S.i+1);}
  else if(a==='prev'){let j=S.i-1;while(j>0&&S.steps[j].kind==='rest')j--;startStep(Math.max(0,j));}
  else if(a==='pause'){
    if(S.paused){S.paused=false;S.endAt=Date.now()+S.remain;}
    else{S.remain=Math.max(0,S.endAt-Date.now());S.paused=true;try{speechSynthesis.cancel();}catch(e){}}
    renderPlayer();
    const t=document.getElementById('time');if(t)t.textContent=fmt(Math.ceil(S.remain/1000));
    const f=document.getElementById('tfill');if(f)f.style.width=Math.min(100,(1-S.remain/S.durMs)*100)+'%';
  }
  else if(a==='plus'){S.endAt+=15000;S.durMs+=15000;S.shown=null;}
  else if(a==='exit'){S.confirm=true;S.pausedBeforeConfirm=S.paused;
    if(!S.paused)S.remain=Math.max(0,S.endAt-Date.now());
    S.paused=true;renderPlayer();}
  else if(a==='exitNo'){
    S.confirm=false;
    if(!S.pausedBeforeConfirm){S.paused=false;S.endAt=Date.now()+S.remain;}
    renderPlayer();
  }
  else if(a==='exitYes'){exitWorkout();}
});

render();
})();
</script>
</body>
</html>
